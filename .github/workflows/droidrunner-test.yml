name: DroidRunner Test

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/droidrunner-test.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  buddy-helper-tests:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Get Buddy source
        shell: bash
        run: |
          set -eu
          SRC="${RUNNER_TEMP:-/tmp}/buddy-droidrunner-test"
          rm -rf "$SRC"
          git clone --depth 1 --branch main https://github.com/novelibrahim3-gif/buddy-android.git "$SRC"
          echo "BUDDY_SOURCE=$SRC" >> "$GITHUB_ENV"

      - name: Run Buddy recorded-agent integration tests
        shell: bash
        run: |
          set -eu
          cd "$BUDDY_SOURCE"
          echo "=== BUDDY HELPER TESTS ON ANDROID RUNNER ==="
          echo "COMMIT=$(git rev-parse --short HEAD)"
          echo "ARCH=$(uname -m)"
          if ! command -v jq >/dev/null 2>&1; then
            if [ "$(id -u)" -eq 0 ]; then
              APT="apt-get"
            elif command -v sudo >/dev/null 2>&1; then
              APT="sudo -n apt-get"
            else
              echo "BLOCKED: jq missing and no permission to install it."
              exit 2
            fi
            $APT update -qq
            $APT install -y -qq jq
          fi
          jq --version
          PATH="$BIN:$PATH" bash linux/test/run.sh
          echo "BUDDY_HELPER_TESTS_SUCCESS"
