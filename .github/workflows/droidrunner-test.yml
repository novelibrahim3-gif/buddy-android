name: DroidRunner Test

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/droidrunner-test.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-runner:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Identify the machine running this job
        shell: bash
        run: |
          set -eu
          echo "=== DROIDRUNNER DIAGNOSTIC ==="
          echo "HOSTNAME=$(hostname)"
          echo "RUNNER_NAME=${RUNNER_NAME:-unknown}"
          echo "RUNNER_OS=${RUNNER_OS:-unknown}"
          echo "RUNNER_ARCH=${RUNNER_ARCH:-unknown}"
          echo "=== KERNEL / ARCH ==="
          uname -a
          uname -m
          echo "=== ANDROID DEVICE ==="
          if command -v getprop >/dev/null 2>&1; then
            echo "MODEL=$(getprop ro.product.model)"
            echo "ANDROID_API=$(getprop ro.build.version.sdk)"
            echo "DEVICE=$(getprop ro.product.device)"
          else
            echo "getprop not available in this runner environment"
          fi
          echo "=== TOOLCHAIN ==="
          command -v bash || true
          command -v git || true
          command -v java || true
          command -v clang || true
          echo "=== STORAGE ==="
          df -h
          echo "=== MEMORY ==="
          if command -v free >/dev/null 2>&1; then free -h; else cat /proc/meminfo | head -12; fi
          echo "=== SUCCESS MARKER ==="
          echo "DROIDRUNNER_TEST_SUCCESS"
