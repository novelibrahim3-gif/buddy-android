name: DroidRunner Test

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/droidrunner-test.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  buddy-helper-tests:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Get Buddy source
        shell: bash
        run: |
          set -eu
          SRC="${RUNNER_TEMP:-/tmp}/buddy-droidrunner-test"
          rm -rf "$SRC"
          git clone --depth 1 --branch main https://github.com/novelibrahim3-gif/buddy-android.git "$SRC"
          echo "BUDDY_SOURCE=$SRC" >> "$GITHUB_ENV"

      - name: Run Buddy recorded-agent integration tests
        shell: bash
        run: |
          set -eu
          cd "$BUDDY_SOURCE"
          echo "=== BUDDY HELPER TESTS ON ANDROID RUNNER ==="
          echo "COMMIT=$(git rev-parse --short HEAD)"
          echo "ARCH=$(uname -m)"
          BIN="${RUNNER_TEMP:-/tmp}/buddy-test-bin"
          mkdir -p "$BIN"
          if command -v jq >/dev/null 2>&1; then
            :
          elif command -v perl >/dev/null 2>&1 && perl -MJSON::PP -e 1 >/dev/null 2>&1; then
            cat > "$BIN/jq" <<'PERL'
          #!/usr/bin/env perl
          use strict;
          use warnings;
          use JSON::PP;
          @ARGV >= 3 && $ARGV[0] eq '-S' && $ARGV[1] eq '-c' && $ARGV[2] eq '.' or die "unsupported jq arguments\n";
          my $json = JSON::PP->new->canonical->allow_nonref->compact;
          while (<>) {
            next unless /\S/;
            my $value = $json->decode($_);
            print $json->encode($value), "\n";
          }
          PERL
            chmod +x "$BIN/jq"
          else
            echo "BLOCKED: jq or Perl JSON::PP is unavailable."
            exit 2
          fi
          PATH="$BIN:$PATH" bash linux/test/run.sh
          echo "BUDDY_HELPER_TESTS_SUCCESS"
