name: DroidRunner Test

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/droidrunner-test.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  buddy-helper-tests:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Get Buddy source
        shell: bash
        run: |
          set -eu
          SRC="${RUNNER_TEMP:-/tmp}/buddy-droidrunner-test"
          rm -rf "$SRC"
          git clone --depth 1 --branch main https://github.com/novelibrahim3-gif/buddy-android.git "$SRC"
          echo "BUDDY_SOURCE=$SRC" >> "$GITHUB_ENV"

      - name: Run Buddy recorded-agent integration tests
        shell: bash
        run: |
          set -eu
          cd "$BUDDY_SOURCE"
          echo "=== BUDDY HELPER TESTS ON ANDROID RUNNER ==="
          echo "COMMIT=$(git rev-parse --short HEAD)"
          echo "ARCH=$(uname -m)"
          for tool in jq node nodejs python3 perl ruby busybox apt-get pkg apk curl wget; do
            if command -v "$tool" >/dev/null 2>&1; then echo "AVAILABLE $tool: $(command -v "$tool")"; fi
          done
          BIN="${RUNNER_TEMP:-/tmp}/buddy-test-bin"
          mkdir -p "$BIN"
          if command -v jq >/dev/null 2>&1; then
            :
          elif command -v node >/dev/null 2>&1; then
            cat > "$BIN/jq" <<'JS'
          #!/usr/bin/env node
          const fs = require('fs');
          const args = process.argv.slice(2);
          if (args[0] !== '-S' || args[1] !== '-c' || args[2] !== '.' || args.length > 4) process.exit(2);
          const input = args.length === 4 ? fs.readFileSync(args[3], 'utf8') : fs.readFileSync(0, 'utf8');
          function sort(v) {
            if (Array.isArray(v)) return v.map(sort);
            if (v && typeof v === 'object') return Object.fromEntries(Object.keys(v).sort().map(k => [k, sort(v[k])]));
            return v;
          }
          for (const line of input.split(/\r?\n/)) if (line.trim()) console.log(JSON.stringify(sort(JSON.parse(line))));
          JS
            chmod +x "$BIN/jq"
            PATH="$BIN:$PATH"
          else
            echo "BLOCKED: jq and Node.js are not installed; no safe JSON normalizer is available."
            exit 2
          fi
          PATH="$BIN:$PATH" bash linux/test/run.sh
          echo "BUDDY_HELPER_TESTS_SUCCESS"
