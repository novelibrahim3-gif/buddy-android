name: DroidRunner Test

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/droidrunner-test.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  buddy-helper-tests:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Get Buddy source
        shell: bash
        run: |
          set -eu
          SRC="${RUNNER_TEMP:-/tmp}/buddy-droidrunner-test"
          rm -rf "$SRC"
          git clone --depth 1 --branch main https://github.com/novelibrahim3-gif/buddy-android.git "$SRC"
          echo "BUDDY_SOURCE=$SRC" >> "$GITHUB_ENV"

      - name: Run Buddy recorded-agent integration tests
        shell: bash
        run: |
          set -eu
          cd "$BUDDY_SOURCE"
          echo "=== BUDDY HELPER TESTS ON ANDROID RUNNER ==="
          echo "COMMIT=$(git rev-parse --short HEAD)"
          echo "ARCH=$(uname -m)"
          BIN="${RUNNER_TEMP:-/tmp}/buddy-jq"
          mkdir -p "$BIN/debs" "$BIN/root"
          if ! command -v jq >/dev/null 2>&1; then
            (cd "$BIN/debs" && apt-get download jq libjq1 libonig5)
            for deb in "$BIN"/debs/*.deb; do dpkg-deb -x "$deb" "$BIN/root"; done
            cat > "$BIN/jq" <<'SH'
          #!/usr/bin/env bash
          ROOT="$(dirname "$0")/root"
          export LD_LIBRARY_PATH="$ROOT/usr/lib/aarch64-linux-gnu:${LD_LIBRARY_PATH:-}"
          exec "$ROOT/usr/bin/jq" "$@"
          SH
            chmod +x "$BIN/jq"
          fi
          PATH="$BIN:$PATH"
          jq --version
          bash linux/test/run.sh
          echo "BUDDY_HELPER_TESTS_SUCCESS"
